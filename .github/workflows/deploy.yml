name: Deploy

on:
  push:
    tags:
      - deploy-*
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Deploy branch/ref (default: current ref)'
        required: false
        type: string
      chatluna_ref:
        description: 'ChatLuna branch/ref (default: qqbot-conversation-runtime)'
        required: false
        type: string
      mode:
        description: 'Deployment mode'
        required: true
        type: choice
        default: prepare-and-activate
        options:
          - prepare
          - prepare-and-activate
      restart_scope:
        description: 'Service restart scope used during activation'
        required: true
        type: choice
        default: koishi
        options:
          - koishi
          - full
      verify_scope:
        description: 'Runtime verification scope after activation'
        required: true
        type: choice
        default: koishi
        options:
          - koishi
          - full

permissions:
  contents: read

concurrency:
  group: deploy-qqbot-production
  cancel-in-progress: false

env:
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.ref }}
  DEPLOY_CHATLUNA_REPO: kkkzbh/chatluna
  DEPLOY_CHATLUNA_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chatluna_ref || 'qqbot-conversation-runtime' }}
  DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'prepare-and-activate' }}
  DEPLOY_RESTART_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.restart_scope || 'koishi' }}
  DEPLOY_VERIFY_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verify_scope || 'koishi' }}
  DEPLOY_PORT: ${{ vars.QQBOT_SERVER_PORT || '22' }}
  DEPLOY_APP_DIR: ${{ vars.QQBOT_SERVER_APP_DIR || '/opt/qqbot/current' }}
  DEPLOY_SHARED_DIR: ${{ vars.QQBOT_SERVER_SHARED_DIR || '/opt/qqbot/shared' }}
  DEPLOY_SYSTEMD_TARGET: ${{ vars.QQBOT_SYSTEMD_TARGET || 'qqbot.target' }}

jobs:
  resolve-revisions:
    name: Resolve external revisions
    runs-on: ubuntu-latest
    outputs:
      chatluna-sha: ${{ steps.chatluna.outputs.sha }}
    steps:
      - name: Resolve ChatLuna ref
        id: chatluna
        shell: bash
        run: |
          set -euo pipefail
          repo_url="https://github.com/${DEPLOY_CHATLUNA_REPO}.git"
          ref="${DEPLOY_CHATLUNA_REF}"

          if [[ "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha="${ref}"
          else
            sha="$(git ls-remote --exit-code "${repo_url}" "refs/heads/${ref}" | awk '{print $1; exit}' || true)"
            if [[ -z "${sha}" ]]; then
              sha="$(git ls-remote --exit-code "${repo_url}" "refs/tags/${ref}^{}" | awk '{print $1; exit}' || true)"
            fi
            if [[ -z "${sha}" ]]; then
              sha="$(git ls-remote --exit-code "${repo_url}" "refs/tags/${ref}" | awk '{print $1; exit}' || true)"
            fi
            if [[ -z "${sha}" ]]; then
              sha="$(git ls-remote --exit-code "${repo_url}" "${ref}" | awk '{print $1; exit}' || true)"
            fi
          fi

          if [[ -z "${sha}" ]]; then
            echo "Failed to resolve ${DEPLOY_CHATLUNA_REPO}@${ref}" >&2
            exit 1
          fi

          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Resolved revisions"
            echo "- QQBot ref: \`${DEPLOY_REF}\`"
            echo "- ChatLuna: \`${DEPLOY_CHATLUNA_REPO}@${ref}\` -> \`${sha}\`"
            echo "- Mode: \`${DEPLOY_MODE}\`"
            echo "- Restart scope: \`${DEPLOY_RESTART_SCOPE}\`"
            echo "- Verify scope: \`${DEPLOY_VERIFY_SCOPE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  build-release:
    name: Build release artifact
    runs-on: ubuntu-latest
    needs:
      - resolve-revisions
    steps:
      - name: Checkout workflow action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false

      - name: Setup workspace
        id: workspace
        uses: ./.github/actions/setup-qqbot-workspace
        with:
          qqbot-ref: ${{ env.DEPLOY_REF }}
          chatluna-repository: ${{ env.DEPLOY_CHATLUNA_REPO }}
          chatluna-ref: ${{ needs.resolve-revisions.outputs.chatluna-sha }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --reporter=dot

      - name: Build
        run: pnpm build

      - name: Koishi startup smoke test
        env:
          ONEBOT_SELF_ID: '100000001'
          OPENAI_API_KEY: sk-ci-smoke
          OPENAI_MODEL: deepseek/deepseek-chat
          TASK_AUTOMATION_INTENT_ENABLED: 'false'
        run: pnpm smoke:start

      - name: Write build manifest
        env:
          QQBOT_REPOSITORY: ${{ github.repository }}
          QQBOT_REF: ${{ env.DEPLOY_REF }}
          QQBOT_SHA: ${{ steps.workspace.outputs.qqbot-sha }}
          CHATLUNA_REPOSITORY: ${{ env.DEPLOY_CHATLUNA_REPO }}
          CHATLUNA_REF: ${{ env.DEPLOY_CHATLUNA_REF }}
          CHATLUNA_SHA: ${{ steps.workspace.outputs.chatluna-sha }}
        run: node ./scripts/ci/write-build-manifest.mjs --output artifacts/build-manifest.json

      - name: Create deploy bundle
        id: bundle
        run: |
          set -euo pipefail
          bundle_path="$(BUILD_MANIFEST_PATH=artifacts/build-manifest.json CHATLUNA_SOURCE_DIR=chatluna-src bash ./scripts/ci/create-deploy-bundle.sh)"
          echo "bundle-path=${bundle_path}" >> "${GITHUB_OUTPUT}"
          echo "bundle-name=$(basename "${bundle_path}")" >> "${GITHUB_OUTPUT}"

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qqbot-release
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.bundle.outputs.bundle-path }}
            artifacts/build-manifest.json

  prepare-production:
    name: Prepare production release
    runs-on: ubuntu-latest
    needs:
      - build-release
    environment:
      name: production
    outputs:
      release-id: ${{ steps.prepare.outputs.release-id }}
    steps:
      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.QQBOT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.QQBOT_SERVER_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.QQBOT_SSH_PRIVATE_KEY }}
          DEPLOY_DOTENV: ${{ secrets.QQBOT_DOTENV }}
          SSH_KNOWN_HOSTS: ${{ secrets.QQBOT_SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_DOTENV SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qqbot-release
          path: artifacts

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.QQBOT_SERVER_HOST }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.QQBOT_SSH_PRIVATE_KEY }}

      - name: Setup known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.QQBOT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf "%s\n" "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload bundle and runtime env
        env:
          DEPLOY_HOST: ${{ secrets.QQBOT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.QQBOT_SERVER_USER }}
          DEPLOY_DOTENV: ${{ secrets.QQBOT_DOTENV }}
        run: |
          set -euo pipefail
          bundle_path="$(find artifacts -maxdepth 1 -type f -name 'qqbot-release-*.tar.gz' -print -quit)"
          if [[ -z "${bundle_path}" ]]; then
            echo "Missing release bundle in artifacts/" >&2
            exit 1
          fi

          remote_base="$(dirname "${DEPLOY_APP_DIR}")"
          remote_incoming="${remote_base}/incoming"
          remote_bundle="${remote_incoming}/$(basename "${bundle_path}")"
          ssh_opts=(-p "${DEPLOY_PORT}" -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes)

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p $(printf '%q' "${remote_incoming}") $(printf '%q' "${DEPLOY_SHARED_DIR}")"
          scp -P "${DEPLOY_PORT}" "${bundle_path}" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_bundle}"

          tmp_env="${DEPLOY_SHARED_DIR}/.env.server.tmp"
          final_env="${DEPLOY_SHARED_DIR}/.env.server"
          printf "%s" "${DEPLOY_DOTENV}" | ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; cat > $(printf '%q' "${tmp_env}") && mv $(printf '%q' "${tmp_env}") $(printf '%q' "${final_env}") && chmod 600 $(printf '%q' "${final_env}")"

          {
            echo "REMOTE_BUNDLE=${remote_bundle}"
          } >> "${GITHUB_ENV}"

      - name: Prepare release on server
        id: prepare
        env:
          DEPLOY_HOST: ${{ secrets.QQBOT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.QQBOT_SERVER_USER }}
        run: |
          set -euo pipefail
          ssh_opts=(-p "${DEPLOY_PORT}" -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes)
          remote_base="$(dirname "${DEPLOY_APP_DIR}")"
          remote_tmp="${remote_base}/incoming/prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          prepare_output="$(ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "QQBOT_RELEASE_BUNDLE=$(printf '%q' "${REMOTE_BUNDLE}") DEPLOY_APP_DIR=$(printf '%q' "${DEPLOY_APP_DIR}") QQBOT_SHARED_DIR=$(printf '%q' "${DEPLOY_SHARED_DIR}") DEPLOY_SYSTEMD_TARGET=$(printf '%q' "${DEPLOY_SYSTEMD_TARGET}") QQBOT_REMOTE_INSTALL_TMP=$(printf '%q' "${remote_tmp}") QQBOT_DEPLOY_SCOPE=$(printf '%q' "${DEPLOY_RESTART_SCOPE}") bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf "${QQBOT_REMOTE_INSTALL_TMP}"
          mkdir -p "${QQBOT_REMOTE_INSTALL_TMP}"
          cleanup() {
            rm -rf "${QQBOT_REMOTE_INSTALL_TMP}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          tar -xzf "${QQBOT_RELEASE_BUNDLE}" -C "${QQBOT_REMOTE_INSTALL_TMP}"
          bash "${QQBOT_REMOTE_INSTALL_TMP}/qqbot/scripts/deploy/install-release.sh" prepare "${QQBOT_RELEASE_BUNDLE}"
          REMOTE
          )"

          printf '%s\n' "${prepare_output}"
          release_id="$(printf '%s\n' "${prepare_output}" | awk -F= '/^QQBOT_RELEASE_ID=/{print $2; exit}')"
          if [[ -z "${release_id}" ]]; then
            echo "Prepare did not return QQBOT_RELEASE_ID" >&2
            exit 1
          fi
          echo "release-id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "QQBOT_RELEASE_ID=${release_id}" >> "${GITHUB_ENV}"

          {
            echo "### Prepared production release"
            echo "- Release: \`${release_id}\`"
            echo "- Mode: \`${DEPLOY_MODE}\`"
            echo "- Restart scope: \`${DEPLOY_RESTART_SCOPE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  activate-production:
    name: Activate production release
    runs-on: ubuntu-latest
    needs:
      - prepare-production
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'prepare-and-activate' }}
    environment:
      name: production
    steps:
      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.QQBOT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.QQBOT_SERVER_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.QQBOT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.QQBOT_SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.QQBOT_SERVER_HOST }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.QQBOT_SSH_PRIVATE_KEY }}

      - name: Setup known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.QQBOT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf "%s\n" "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Activate release on server
        env:
          DEPLOY_HOST: ${{ secrets.QQBOT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.QQBOT_SERVER_USER }}
          QQBOT_RELEASE_ID: ${{ needs.prepare-production.outputs.release-id }}
        run: |
          set -euo pipefail
          if [[ -z "${QQBOT_RELEASE_ID}" ]]; then
            echo "Missing prepared release id" >&2
            exit 1
          fi

          ssh_opts=(-p "${DEPLOY_PORT}" -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes)
          remote_base="$(dirname "${DEPLOY_APP_DIR}")"
          remote_script="${remote_base}/releases/${QQBOT_RELEASE_ID}/qqbot/scripts/deploy/install-release.sh"

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_APP_DIR=$(printf '%q' "${DEPLOY_APP_DIR}") QQBOT_SHARED_DIR=$(printf '%q' "${DEPLOY_SHARED_DIR}") DEPLOY_SYSTEMD_TARGET=$(printf '%q' "${DEPLOY_SYSTEMD_TARGET}") QQBOT_DEPLOY_SCOPE=$(printf '%q' "${DEPLOY_RESTART_SCOPE}") bash $(printf '%q' "${remote_script}") activate $(printf '%q' "${QQBOT_RELEASE_ID}")"

          {
            echo "### Activated production release"
            echo "- Release: \`${QQBOT_RELEASE_ID}\`"
            echo "- Restart scope: \`${DEPLOY_RESTART_SCOPE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  verify-production:
    name: Verify production release
    runs-on: ubuntu-latest
    needs:
      - prepare-production
      - activate-production
    if: ${{ always() && needs.activate-production.result == 'success' }}
    steps:
      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.QQBOT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.QQBOT_SERVER_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.QQBOT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.QQBOT_SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.QQBOT_SERVER_HOST }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.QQBOT_SSH_PRIVATE_KEY }}

      - name: Setup known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.QQBOT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf "%s\n" "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Verify release on server
        env:
          DEPLOY_HOST: ${{ secrets.QQBOT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.QQBOT_SERVER_USER }}
          QQBOT_RELEASE_ID: ${{ needs.prepare-production.outputs.release-id }}
        run: |
          set -euo pipefail
          if [[ -z "${QQBOT_RELEASE_ID}" ]]; then
            echo "Missing prepared release id" >&2
            exit 1
          fi

          ssh_opts=(-p "${DEPLOY_PORT}" -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_APP_DIR=$(printf '%q' "${DEPLOY_APP_DIR}") QQBOT_SHARED_DIR=$(printf '%q' "${DEPLOY_SHARED_DIR}") DEPLOY_SYSTEMD_TARGET=$(printf '%q' "${DEPLOY_SYSTEMD_TARGET}") bash $(printf '%q' "${DEPLOY_APP_DIR}/scripts/deploy/install-release.sh") verify $(printf '%q' "${DEPLOY_VERIFY_SCOPE}") $(printf '%q' "${QQBOT_RELEASE_ID}")"

          {
            echo "### Verified production release"
            echo "- Release: \`${QQBOT_RELEASE_ID}\`"
            echo "- Verify scope: \`${DEPLOY_VERIFY_SCOPE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
